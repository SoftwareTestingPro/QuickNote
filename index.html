<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Quick Note</title>
  <meta name="description" content="Minimal private note and communication tool">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quick Note">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=10">
  <!-- Config & Firebase SDKs -->
  <script src="config.js?v=6"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="app-container" id="app">
    <!-- Top Bar -->
    <header class="app-header">
      <div class="profile-info">
        <div class="avatar-wrapper" id="profileBtn" title="Quick Notes">
          <div class="avatar online" id="userAvatar">QN</div>
        </div>
        <div class="header-text">
          <h2 id="partnerNameDisplay">Quick Note</h2>
          <p id="connectionStatus">All notes synced</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Internet Call Button (Hidden until PIN unlocked) -->
        <button class="call-btn hidden" id="callBtn" title="Call">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </button>

        <!-- Disguised subscription badge -->
        <div class="mode-badge locked" id="modeBadge" title="Subscription Status">
          <span id="lockIcon">⭐</span>
          <span id="lockLabel">Go Premium</span>
        </div>
      </div>
    </header>

    <!-- Message stream -->
    <main class="chat-body" id="chatMessages">
      <!-- Dynamic messages injected here -->
    </main>

    <!-- Input Footer -->
    <footer class="chat-footer">
      <div class="compose-box">
        <div class="input-row">
          <input type="text" id="fakeInput" class="fake-input" placeholder="Type a message..." autocomplete="off">
        </div>
        
        <div class="secret-input-wrapper" id="secretInputWrapper">
          <span class="secret-label">Note:</span>
          <input type="text" id="secretInput" class="secret-input" placeholder="Additional details..." autocomplete="off">
        </div>

        <div class="controls-row">
          <button type="button" class="toggle-secret-btn" id="toggleSecretBtn">
            <span>+ Attach Note</span>
          </button>
          <button type="button" class="send-btn" id="sendBtn" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </footer>

    <!-- Subscription Key Modal -->
    <div class="modal-overlay" id="pinModal">
      <div class="modal-card">
        <h3><span>⭐</span> Activate Premium</h3>
        <p>Enter your 4-digit subscription key to enable premium cloud sync and enhanced features.</p>
        
        <div class="pin-dots" id="pinDots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="keypad" id="keypad">
          <button class="key-btn" data-key="1">1</button>
          <button class="key-btn" data-key="2">2</button>
          <button class="key-btn" data-key="3">3</button>
          <button class="key-btn" data-key="a">A</button>

          <button class="key-btn" data-key="4">4</button>
          <button class="key-btn" data-key="5">5</button>
          <button class="key-btn" data-key="6">6</button>
          <button class="key-btn" data-key="b">B</button>

          <button class="key-btn" data-key="7">7</button>
          <button class="key-btn" data-key="8">8</button>
          <button class="key-btn" data-key="9">9</button>
          <button class="key-btn" data-key="c">C</button>

          <button class="key-btn" data-key="d">D</button>
          <button class="key-btn" data-key="0">0</button>
          <button class="key-btn" data-key="e">E</button>
          <button class="key-btn" data-key="f">F</button>

          <button class="key-btn key-action" id="keyClear">C</button>
          <button class="key-btn key-action" id="keyBack">⌫</button>
        </div>

        <div class="modal-actions">
          <button class="btn btn-secondary" id="cancelPinBtn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Panic Screen: Instant Disguise as harmless Shopping Wishlist / Notes -->
    <div class="panic-banner" id="panicScreen">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e5e7eb; padding-bottom:12px;">
        <h2 style="font-size:20px; font-weight:700;">Grocery & Shopping Checklist</h2>
        <button id="exitPanicBtn" style="border:none; background:#f3f4f6; padding:6px 12px; border-radius:6px; font-weight:600; cursor:pointer;">Close</button>
      </div>
      <div style="margin-top:16px; display:flex; flex-direction:column; gap:12px; font-size:15px;">
        <label><input type="checkbox" checked> Almond milk (unsweetened)</label>
        <label><input type="checkbox" checked> Greek yogurt & berries</label>
        <label><input type="checkbox"> Organic eggs & butter</label>
        <label><input type="checkbox"> Sourdough bread</label>
        <label><input type="checkbox"> Olive oil & Himalayan salt</label>
        <label><input type="checkbox"> Avocados</label>
      </div>
    </div>

    <!-- Floating Toast Notification -->
    <div class="toast" id="toast">Notice message</div>

    <!-- Internet Call Overlay Modal -->
    <div class="call-overlay" id="callOverlay">
      <div class="call-card">
        <div class="call-avatar" id="callAvatar">
          <span>📞</span>
        </div>
        <h3 id="callTitle">Voice Call</h3>
        <p id="callStatusText">Connecting...</p>
        <div class="call-duration" id="callDuration">00:00</div>

        <div class="call-actions">
          <!-- Incoming call buttons -->
          <div class="call-actions-incoming" id="callIncomingActions">
            <button class="call-action-btn decline" id="declineCallBtn" title="Decline">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <button class="call-action-btn accept" id="acceptCallBtn" title="Accept">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
            </button>
          </div>

          <!-- Active or Outgoing Call Controls -->
          <div class="call-actions-active" id="callActiveActions">
            <button class="call-action-btn mute" id="toggleMuteBtn" title="Mute Microphone">
              <svg id="muteIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>
            <button class="call-action-btn hangup" id="hangupCallBtn" title="End Call">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path>
                <line x1="23" y1="1" x2="1" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <!-- Hidden audio tag to play remote audio -->
      <audio id="remoteAudio" autoplay playsinline></audio>
    </div>
  </div>

  <script src="app.js?v=10"></script>
</body>
</html>
